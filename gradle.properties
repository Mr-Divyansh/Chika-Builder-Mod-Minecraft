# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.1 ships UNOBFUSCATED. Its version manifest publishes only
# "client" and "server" downloads and no "client_mappings" entry, so the game
# jar already uses the real class names (net.minecraft.core.BlockPos,
# net.minecraft.client.Minecraft, ...).
#
# This is why baritone-meteor-26.1.jar compiles against Mojang names and why
# Yarn publishes no 26.1 build. There is also nothing to remap, so Loom must be
# told to skip obfuscation handling entirely:
#
#   fabric.loom.disableObfuscation -> Loom selects NoRemapMappingConfiguration
#                                     instead of requiring a 'mappings' dep
#   loom.noIntermediateMappings() -> no intermediary namespace is applied
#
# Without these, Loom fails with either
#   "Failed to find official mojang mappings for 26.1" or
#   "Configuration 'mappings' has no dependencies".
fabric.loom.disableObfuscation=true

# Minecraft 26.1.2
# Verified compatible with the internal build engine: the full Minecraft API
# surface (10,682 classes) was diffed between 26.1 and 26.1.2 and every class the
# engine touches is byte-identical. See README "Version compatibility".
minecraft_version=26.1.2
loader_version=0.18.6

# Fabric API build published specifically for Minecraft 26.1.2
fabric_version=0.155.3+26.1.2

# Mod Properties
mod_version=1.0.0
maven_group=dev.chika
archives_base_name=chika-builder