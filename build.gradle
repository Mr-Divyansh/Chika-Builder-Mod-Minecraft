plugins {
    id 'fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The build engine that powers #chika_build.
//
// It is consumed at COMPILE time and then MERGED INTO THIS MOD'S JAR (see the
// `jar` task below), so players install exactly one file and the Mods screen
// lists only Chika Builder.
def engineJar = file('local/baritone-meteor-26.1.jar')

if (!engineJar.exists()) {
    throw new GradleException("Missing build engine: ${engineJar.absolutePath}\n" +
            "Obtain it from its original distribution and place it there. " +
            "It is third-party (LGPL-3.0) and is not redistributed in this repo.")
}

loom {
    // Minecraft 26.1 ships UNOBFUSCATED, so there is nothing to remap to or from
    // intermediary mappings. Disabling intermediary lets Loom use the
    // NoRemapMappingConfiguration instead of demanding a 'mappings' dependency.
    noIntermediateMappings()

    // The build engine ships nested jars (META-INF/jars) and its own mixin
    // plugin, so it must be merged into this mod's jar exactly as-is: never
    // relocated, never shaded, never rewritten.
    runs {
        client {
            client()
            ideConfigGenerated true
            runDir 'run'
        }
    }
}

// The Minecraft version is read from gradle.properties so the Baritone
// dependency and the Minecraft dependency can never drift apart.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // NO mappings are declared on purpose.
    //
    // Minecraft 26.1 ships UNOBFUSCATED: its version manifest publishes only
    // "client" and "server" downloads and no "client_mappings" entry, so there
    // are no ProGuard mappings to apply and none to download. Class names in the
    // jar are already the real ones (net.minecraft.core.BlockPos,
    // net.minecraft.client.Minecraft, ...).
    //
    // This is also why baritone-meteor-26.1.jar compiles against Mojang names
    // and why Yarn publishes no 26.1 build. Requesting
    // `loom.officialMojangMappings()` fails with
    // "Failed to find official mojang mappings for 26.1".

    // modImplementation() only exists when Loom builds remapped variants.
    // With fabric.loom.disableObfuscation=true there is nothing to remap, so the
    // regular Gradle configurations are used instead.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The build engine is consumed as a plain compile-time + runtime
    // dependency, then MERGED INTO this mod's jar by the `jar` task below.
    // It is included as-is (nested jars and mixin plugin preserved, never
    // relocated or shaded), so the player installs a single file and the Mods
    // screen shows only Chika Builder.
    implementation files('local/baritone-meteor-26.1.jar')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // Minecraft 26.1 requires Java 25, so the mod is compiled for Java 25 too.
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:deprecation'
}

// Loom provisions the Java 25 toolchain that Minecraft 26.1 requires.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    // Merge the build engine INTO this mod's jar.
    //
    // Why this works: the engine declares `"entrypoints": {}` and initialises
    // itself through mixins (MixinMinecraft#postInit calls
    // BaritoneAPI.getProvider()). It never looks itself up in Fabric's mod
    // registry - no class references `baritone-meteor` or `ModContainer`. Its
    // FabricMixinPlugin gates on isModLoaded("baritone") (note: "baritone",
    // not the engine's own id), which is false in both the split and the
    // merged layout, so every mixin still applies.
    //
    // The engine's own fabric.mod.json is EXCLUDED so this mod's metadata stays
    // the only one, which is what keeps a second "Baritone" row out of the
    // Mods screen. Its mixin config and nested library are kept and are
    // declared by this mod's fabric.mod.json instead.
    from(zipTree(engineJar)) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'

        // The engine's mixin config is renamed so the shipped jar carries no
        // engine-named resource. Renaming the FILE is safe: FabricMixinPlugin
        // gates on the mixin CLASS names ("baritone.launch.mixins.*"), which
        // are untouched, not on the config file name.
        rename { String name ->
            if (name == 'mixins.baritone-meteor.json') {
                return 'mixins.chika_engine.json'
            }
            return name
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}